# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - KeeperPorter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build server/keeper.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish server/keeper.csproj -c Release -o "${{ github.workspace }}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: ${{ github.workspace }}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: myapp
          path: ${{ github.workspace }}/myapp

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F787A07D6AAB4A57846C0ECA88034A28 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_241A4609E1BC40C291061F3FCB0C23EA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_81BD094D34894879A24F3A2DA9C4B2F4 }}

      - name: Set connection string in Azure App Service
        uses: azure/appservice-settings@v1
        with:
          app-name: 'KeeperPorter'
          connection-strings-json: >-
            {
            "DefaultConnection": {
            "value": "${{ secrets.AZURE_CONNECTION_STRING }}",
            "type": "MySql"
            }
            }


      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'KeeperPorter'
          slot-name: 'Production'
          package: ${{ github.workspace }}/myapp
